# Edytor to statyczna strona — publikujemy repozytorium tak, jak jest, po każdej zmianie na main.
name: Publikacja edytora
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Najpierw testy (edytor + eksport w Chromium). Czerwone = brak publikacji, edytor zostaje na poprzedniej wersji.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright + axe
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Testy
        working-directory: tests
        run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Numer wersji nadawany przy wdrożeniu (czas commita, Warszawa) — nie trzeba pamiętać o release.sh
      - name: Numer wersji
        run: ./scripts/release.sh "$(TZ=Europe/Warsaw date -d @$(git log -1 --format=%ct) +%Y.%m.%d.%H%M)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
